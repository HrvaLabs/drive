name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# Cancel stale builds so an older commit cannot overwrite mutable :latest tags.
concurrency:
  group: drive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./analysis
          push: ${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HrvaDrive analysis service
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/hrva-drive-analysis:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/hrva-drive-analysis:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HrvaDrive frontend service
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/hrva-drive-frontend:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/hrva-drive-frontend:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
