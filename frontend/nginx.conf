server {
    listen 80;
    client_max_body_size 150M;   # OBD2 exports can be ~26MB+; default is 1MB

    location = /api/v1/drives:analyze {
        proxy_pass http://analysis:8000/analyze;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Device-sync pairing relay (WebSocket): handshake forwarding only, nothing stored.
    location /api/v1/sync/ {
        proxy_pass http://analysis:8000/sync/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
